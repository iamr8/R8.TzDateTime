name: Release

# Runs when develop is merged into main (main is protected — no direct pushes). Builds, tests, verifies
# the version isn't already published, packs, tags, and creates the GitHub release. It does NOT push to
# NuGet — that is nuget-publish.yml, which runs only if this workflow succeeds.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the git tag and GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, publish to NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so SourceLink embeds correct commit info

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Read package version from csproj
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/R8.TzDateTime.csproj)
          if [ -z "$VERSION" ]; then echo "Could not read <Version> from csproj"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Guard - fail if this version is already published (bump the version!)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PUBLISHED=$(curl -s https://api.nuget.org/v3-flatcontainer/r8.tzdatetime/index.json || true)
          if echo "$PUBLISHED" | grep -q "\"$VERSION\""; then
            echo "::error::Version $VERSION is already published to NuGet. Increment <Version> (SemVer) before merging to main."
            exit 1
          fi
          echo "Version $VERSION is new — proceeding."

      # Build the test project (references the library) rather than the whole solution, so IDE-added
      # auxiliary projects can't affect the release build.
      - name: Restore
        run: dotnet restore tests/R8.TzDateTime.Tests.csproj

      - name: Build (warnings as errors)
        run: dotnet build tests/R8.TzDateTime.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      - name: Test net6.0
        run: dotnet test tests/R8.TzDateTime.Tests.csproj -c Release -f net6.0 --no-build

      - name: Test net8.0
        run: dotnet run --project tests/R8.TzDateTime.Tests.csproj -c Release -f net8.0 --no-build

      - name: Pack
        run: dotnet pack src/R8.TzDateTime.csproj -c Release --no-build -o ./artifacts

      # The NuGet push lives in a separate workflow (nuget-publish.yml) that runs only when THIS
      # workflow succeeds. The package is handed over as an artifact.
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.*nupkg
          if-no-files-found: error

      - name: Tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes ./artifacts/*.nupkg
