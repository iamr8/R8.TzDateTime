name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test-reporter publishes a check run with per-test results
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore
        run: dotnet restore R8.TzDateTime.sln

      - name: Build (warnings as errors)
        run: dotnet build R8.TzDateTime.sln -c Release --no-restore -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      - name: Test net6.0
        run: dotnet test tests/R8.TzDateTime.Tests/R8.TzDateTime.Tests.csproj -c Release -f net6.0 --no-build --logger "trx;LogFileName=net6.trx" --results-directory test-results

      # xunit.v3 (net8) builds a self-running test executable; run it directly and emit a TRX report.
      - name: Test net8.0
        run: dotnet run --project tests/R8.TzDateTime.Tests/R8.TzDateTime.Tests.csproj -c Release -f net8.0 --no-build -- -trx test-results/net8.trx

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() # report pass/fail (and which tests) even when the run failed
        with:
          name: Test results
          path: test-results/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/

  aot-smoke:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT sample
        run: dotnet publish samples/AotSmoke/AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run native binary
        run: ./aot-out/AotSmoke
